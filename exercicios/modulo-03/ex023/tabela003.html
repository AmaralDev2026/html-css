<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style003.css">
    <title>Tabela</title>
</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td><!-- (colspan)expansão de "DUAS" COLUNAS (COL = É COLUNAS)-->
            
        </tr>
        <tr>
            <td rowspan="3">D</td><!-- (rowspan)expansão de "DUAS" LINHAS (ROW = É LINHAS)-->
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
           
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            
            <td>L</td>
            <td>K</td>
        </tr>
    </table>
</body>
</html>
