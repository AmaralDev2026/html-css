<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
        }
        
        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;

            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
<!--
flex-direction: (row) ou (column => quando usado é obrigatório colocar valor na altura do bloco (height))

quando usar esses flex não usar o => flex: auto; (flex: auto não funciona no elemento pai)

fle-wrap: wrap (quebra de posição em redução dos blocos)
flex-wrap: nowwrap (não quebrar a posição dos blocos)
flex-wrap: wrap-reverse (quebra de posição dos blocos em posição inversa do eixo transversal)

os comandos flex-direction: (row) ou (column), podem ser substituidos pelo comando (flex-flow)
flex-flow: row wrap/ nowwrap/ wrap-reverse
-->
