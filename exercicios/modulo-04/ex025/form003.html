<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia/ Mês/ Ano</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <p>
        <label for="inome">Nome</label>
        <input type="text" name="nome" id="inome" required maxlength="30" placeholder="nome completo" autocomplete="name" required>
    </p>
    <p>
        <label for="imedia">Média</label>
        <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required>
    </p>
    <p>
        <label for="imes">Período Letivo</label>
        <input type="month" name="mes" id="imes">
    </p>
    <p>
        <label for="idia">Dia da Prova</label>
        <input type="date" name="data" id="idia" required>
    </p>
    <p>
        <label for="ihora">Hora da Prova</label>
        <input type="time" name="hora" id="ihora">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
<!--
    oninput="calcIdade()": Chama a função toda vez que o valor do input muda.
    new Date().getFullYear(): Obtém o ano atual (2026).
    <output>: Elemento HTML5 ideal para exibir resultados de cálculos.
    Number(iano.value): Garante que o valor capturado seja tratado como número para a subtração

    select =>............................cria opções de seleção dentro caixa de seleção
    optgroup =>..........................criando um grupo com lista de opções
    option =>............................opções dentro do "optgroup"
    datalist =>..........................caixa com texto inseridos pelo DEV para opção do usuário escolher, pode digitar tbm
    textarea =>..........................caixa de texto para ssuas mensagens para o site
    fieldset =>..........................grupo de campos, cria uma borda em volta do que desejo destacar 
    legend =>............................sempre acompanha o fieldset
    pattern="^[0-9]{4}-[0-9]{4}$" =>.... parametro para num. de telefone, inicia (^) fecha ($)[0-9]padrão de numeros {} digitos
    estudar mais sobre =>................RegEx
    required => .........................mostra mensagem para campo obrigatório 
    minlength => ........................mínimo a ser digitado (comprimento mínimo)
    maxlength => ........................máximo a ser digitado (comprimento máximo)
    size => .............................quantidades de letras a ser digitado 
    placeholder => ......................local para colocar coisas (espaço reservado)
    autocomplete (on) (off) => ..........grava ou não grava o que foi digitado 
    autocomplete (username) => ..........para salvar o nome do usuário 
    autocomplete (current-password) => ..para salvar a senha do usuário 
    autocomplete (new-password) => ......para uma nova senha do usuário 
    checked =>...........................em radio só se usa uma vez
    radio =>.............................na identificação de mesmo grupo pra opção de escolha tem que ter o mesmo nome "sexo" no como exemplo acima, o id tem que ser diferente
