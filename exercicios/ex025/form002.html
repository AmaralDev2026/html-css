<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuário/ Senha</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required maxlength="30" size="10" placeholder="nome do Usuário" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" placeholder="mínimo 8 letras" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

    legend =>............................sempre acompanha o fieldset

    required => .........................mostra mensagem para campo obrigatório 
    minlength => ........................mínimo a ser digitado (comprimento mínimo)
    maxlength => ........................máximo a ser digitado (comprimento máximo)
    size => .............................quantidades de letras a ser digitado 
    placeholder => ......................local para colocar coisas (espaço reservado)
